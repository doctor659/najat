<style>
[hidden]{display:none!important}
:root{--ink:#1B140C;--panel:#2A1F14;--panel2:#3A2B1B;--gold:#F0C068;--gold2:#C8913F;--sand:#F3E3C3;--muted:#BFA987;--water:#45C3D6;--red:#E0634A;--green:#6FCF97;
--display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;margin:0;height:100%;overflow:hidden;background:#140F09;color:var(--sand);font-family:var(--body);font-size:15px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
/* HUD */
#hud{position:relative;z-index:5;background:linear-gradient(180deg,rgba(20,14,8,.96),rgba(20,14,8,.82));border-bottom:2px solid var(--gold2);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:42px;height:42px;border-radius:12px;background:radial-gradient(circle at 30% 30%,#F7D58A,#B07A2E);border:2px solid #FBE3A8;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:#3A240C;flex:none}
.me b{display:block;font-family:var(--display);font-size:17px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--muted);font-size:12px}
.gal{background:linear-gradient(180deg,#0F4C57,#0A3640);border:1.5px solid var(--water);border-radius:12px;padding:4px 10px;font-weight:700;color:#BFF2FA;white-space:nowrap;font-variant-numeric:tabular-nums}
.resbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.resbar span{background:rgba(255,255,255,.06);border:1px solid rgba(240,192,104,.25);border-radius:9px;padding:3px 6px;font-size:12.5px;text-align:center;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.resbar b{color:#FFF3D6}
/* stage */
#stage{position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom button{width:44px;height:44px;border-radius:12px;border:2px solid var(--gold2);background:rgba(30,21,12,.88);color:var(--gold);font-size:22px;font-weight:700;cursor:pointer}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(30,21,12,.9);border:1.5px solid var(--gold2);color:var(--gold);padding:6px 14px;border-radius:99px;font-family:var(--display);font-size:15px;white-space:nowrap;pointer-events:none}
/* nav */
#nav{z-index:5;display:grid;grid-template-columns:repeat(6,1fr);background:linear-gradient(0deg,#140F09,#21170D);border-top:2px solid var(--gold2);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
#nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;cursor:pointer;border-radius:10px}
#nav button span{font-size:11px;font-weight:700}
#nav button.on{color:var(--gold);background:rgba(240,192,104,.12)}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:78%;overflow-y:auto;background:linear-gradient(180deg,#3A2B1B,#241A10);border-top:3px solid var(--gold);border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shade{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35)}
.sheet .x{position:sticky;top:0;float:left;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--gold2);background:#241A10;color:var(--gold);font-size:18px;cursor:pointer}
.sheet h2{font-family:var(--display);color:var(--gold);font-size:24px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:linear-gradient(180deg,#F7D58A,#D49A3E);color:#2B1A08;box-shadow:0 3px 0 #8A5A1C}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8A5A1C}
.btn.alt{background:linear-gradient(180deg,#5B4630,#3E2F1F);color:var(--sand);box-shadow:0 3px 0 #1E150C;border:1px solid #6B5238}
.btn.red{background:linear-gradient(180deg,#F08A6E,#C24A33);color:#fff;box-shadow:0 3px 0 #7A2A1A}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(240,192,104,.25);border-radius:14px;padding:12px;margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px dashed rgba(240,192,104,.15)}.kv:last-child{border:0}
.kv b{color:#FFF3D6;font-variant-numeric:tabular-nums}
.bar{height:9px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#D49A3E,#F7D58A);border-radius:99px}.bar.w i{background:linear-gradient(90deg,#1F8FA3,#7FE3F1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.hero{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(240,192,104,.25)}
.hero .art{height:120px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(160deg,var(--c),#241A10)}
.hero .art canvas{width:110px;height:110px}
.hero .lvb{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#FFF4DE;font-family:var(--display);padding:1px 10px;border-radius:8px}
.hero .cls{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.hero .body{padding:10px}
.hero h3{font-family:var(--display);color:var(--gold);margin:0;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;text-align:center;margin-top:6px}.stats div{background:rgba(0,0,0,.25);border-radius:8px;padding:4px;font-size:11px;color:var(--muted)}.stats b{display:block;color:#FFF3D6;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tbl{overflow-x:auto;margin-top:10px}.tbl table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}.tbl th,.tbl td{padding:7px 4px;text-align:center;border-bottom:1px solid rgba(240,192,104,.15);font-size:13px}.tbl th{color:var(--muted);font-weight:500}.off{color:#6E5D47}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid #6B5238;background:#1B140C;color:var(--sand)}
.train{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pk{position:relative;background:linear-gradient(180deg,#0F4C57,#0A2D35);border:1.5px solid var(--water);border-radius:16px;padding:14px 10px;text-align:center}
.pk .bonus{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:700;font-size:11.5px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pk .amt{font-family:var(--display);font-size:22px;color:#BFF2FA}.pk .price{font-weight:700;font-size:18px;margin:4px 0 8px}
.chat{display:flex;flex-direction:column;height:52vh}.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:4px}
.msg{background:rgba(255,255,255,.07);border-radius:12px;padding:6px 10px;max-width:85%;align-self:flex-start;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:rgba(69,195,214,.18)}.msg b{display:block;font-size:12px;color:var(--gold)}
.send{display:flex;gap:8px;margin-top:8px}
.result{text-align:center}.result .big{font-family:var(--display);font-size:42px;margin:6px 0}.win{color:var(--green)}.lose{color:var(--red)}
.toast img{vertical-align:middle;margin:0 2px}.toast{position:fixed;top:calc(120px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:rgba(20,14,8,.95);border:1.5px solid var(--gold);color:var(--gold);padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:up .2s}
/* auth */
#auth{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,rgba(60,40,15,.55),rgba(10,7,4,.92))}
.abox{width:100%;max-width:400px;background:linear-gradient(180deg,#3A2B1B,#241A10);border:2px solid var(--gold);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:11px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.abox h1{font-family:var(--display);color:var(--gold);text-align:center;margin:0;font-size:34px;line-height:1.1}
.abox .tag{text-align:center;color:var(--muted);font-size:13px;margin-top:-4px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ri{width:20px;height:20px;object-fit:contain;vertical-align:-5px}
.bimg{display:flex;justify-content:center;margin:0 0 6px}.bimg img{height:150px;max-width:85%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55))}
.hero .art{height:auto;aspect-ratio:3/4;background-size:cover;background-position:center 18%}
.hero .art::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(20,12,5,.9))}
.hero .lvb,.hero .cls{z-index:1}.hero .cls{display:flex;align-items:center;gap:4px}
#auth{background:#140F09 center/cover no-repeat;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.logo{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.05;text-align:center;background:linear-gradient(180deg,#FFF4CF,#F0C068 50%,#B7791F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a2a08) drop-shadow(0 10px 22px rgba(0,0,0,.7))}
.abox{background:linear-gradient(180deg,rgba(58,43,27,.86),rgba(30,21,12,.92))!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
th .ri{width:26px;height:26px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px -4px 2px;padding:2px 4px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:99px;border:1.5px solid #6B5238;background:#241A10;color:var(--muted);cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#F7D58A,#D49A3E);color:#2B1A08;border-color:#F7D58A}
.gbal{display:inline-flex;align-items:center;gap:6px;background:rgba(15,76,87,.55);border:1px solid var(--water);border-radius:99px;padding:4px 6px 4px 12px;font-size:14px;margin-top:2px;cursor:pointer}.gbal b{color:#BFF2FA}
.gbal .plus{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--water);color:#06323A;font-weight:800}
.shead{display:flex;align-items:center;gap:8px;font-family:var(--display);color:var(--gold);font-size:18px;margin:16px 0 0}.shead small{font-family:var(--body);color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.grid.g2{grid-template-columns:repeat(2,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(240,192,104,.3);border-radius:14px;padding:10px 7px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item .ii{height:44px;display:flex;align-items:center;justify-content:center;font-size:32px}.item .il{font-weight:700;font-size:13px;color:#FFF3D6}
.btn.sm{padding:8px 4px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.confirm{background:linear-gradient(180deg,#8FE3A8,#3FA866)!important;box-shadow:0 3px 0 #1F6B3A!important;color:#0B2614!important}
.hthumb{width:30px;height:30px;border-radius:8px;object-fit:cover;object-position:top;border:1px solid var(--gold2)}
.deal{position:relative;margin-top:18px;padding:16px 12px 12px;border-radius:16px;border:1.5px solid var(--gold);background:radial-gradient(ellipse at top,rgba(240,192,104,.24),rgba(36,26,16,.6))}
.deal h3{font-family:var(--display);color:var(--gold);margin:0;font-size:22px}.dl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dl span{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.32);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700}
.dtag{position:absolute;top:-11px;left:14px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px}
.gal{cursor:pointer}
.hbtns{display:flex;align-items:center;gap:8px;flex:none}
.rshop{font:inherit;font-weight:700;font-size:13px;border:1.5px solid #FBE3A8;border-radius:12px;padding:6px 10px;background:linear-gradient(180deg,#F7D58A,#D49A3E);color:#2B1A08;box-shadow:0 2px 0 #8A5A1C;cursor:pointer;white-space:nowrap}
.rshop:active{transform:translateY(2px);box-shadow:none}
.resbar span{position:relative;cursor:pointer;overflow:visible!important}
.resbar span::after{content:"+";position:absolute;top:-7px;left:-5px;width:17px;height:17px;border-radius:50%;background:#3FA866;color:#fff;font-size:14px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 1px 0 #1F6B3A}
.rep{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(240,192,104,.25);border-inline-start:4px solid var(--green)}.rep.l{border-inline-start-color:var(--red)}
.rh{display:flex;justify-content:space-between;gap:8px;align-items:center}.rh b{color:#FFF3D6;font-size:14px}.rd{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.9}
.rbadge{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff!important;font-size:11px!important;font-weight:800;line-height:19px;text-align:center;box-shadow:0 0 0 2px #140F09}
#nav button,.zoom button{position:relative}
.rpt{text-align:center}.rban{font-family:var(--display);font-size:34px;padding:8px;border-radius:14px;margin:2px 0;color:#fff;background:linear-gradient(90deg,transparent,rgba(63,168,102,.6),transparent)}.rpt.l .rban{background:linear-gradient(90deg,transparent,rgba(224,99,74,.6),transparent)}
.rsub{color:var(--muted);font-size:13.5px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.side{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}

.vsx{font-family:var(--display);font-size:26px;color:#F0C068;text-shadow:0 2px 0 #4a2a08}
.pbar{height:10px;border-radius:99px;background:#C0392B;overflow:hidden;margin-top:12px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3FA866,#8FE3A8)}.pnote{font-size:12.5px;color:var(--muted);margin-top:5px}

.loot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.loot div{background:rgba(63,168,102,.14);border:1px solid rgba(111,207,151,.4);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}.loot b{color:#8FE3A8;font-size:13px;font-variant-numeric:tabular-nums}
.tgrid,.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;text-align:center}.tgrid div,.rgrid div{background:rgba(0,0,0,.28);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;gap:2px}

.qn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.qn .btn{flex:1;min-width:56px}

.btn.heal{background:linear-gradient(180deg,#8FE3A8,#3FA866);box-shadow:0 3px 0 #1F6B3A;color:#0B2614}

/* ⚡ طاقة الصيد: 120 حد أقصى، نقطة كل 5 دقايق */
const EN_MAX=120,EN_T=300000;
const enCost=l=>Math.min(10,4+Math.ceil(l/5));
function enNow(){const e=((C&&C.progress)||{}).en;if(!e)return EN_MAX;return Math.min(EN_MAX,e.v+Math.floor((Date.now()-e.t)/EN_T))}
async function enUse(l){const c=enCost(l),v=enNow();if(v<c){toast(`⚡ طاقة الصيد مش كفاية (${v}/${c}). بتزيد نقطة كل 5 دقايق`);return false}
  const p=prog(),e=p.en||{v:EN_MAX,t:Date.now()},cur0=Math.min(EN_MAX,e.v+Math.floor((Date.now()-e.t)/EN_T)),t=cur0>=EN_MAX?Date.now():e.t+Math.floor((Date.now()-e.t)/EN_T)*EN_T;p.en={v:cur0-c,t};return !!(await commit(p))}
setInterval(()=>{let el=$('enC');if(!el){el=document.createElement('div');el.id='enC';document.body.appendChild(el);el.onclick=()=>toast(`⚡ طاقة الصيد ${enNow()}/${EN_MAX} · كل وحش بياخد من 5 لـ 10 على حسب ليفله، والطاقة بتزيد نقطة كل 5 دقايق`)}
  if(!C||VIEW!=='world'){el.hidden=true;return}el.hidden=false;el.innerHTML=`⚡ <b>${enNow()}</b>/${EN_MAX}`},1000);

/* 🎁 مواد التعويذات من الصيد والحشود (حد يومي) */
function spDrop(p,k,n){if(!['monster','rally','boss'].includes(k))return;if(!p.sd||p.sd.d!==today())p.sd={d:today(),e:0,s:0,mk:0};p.bag=p.bag||{};
  for(let t=0;t<Math.min(n,5);t++){if(k==='monster')p.sd.mk++;const ne=k==='monster'?1:2;for(let j=0;j<ne&&p.sd.e<8;j++){const m=SPL[Math.floor(Math.random()*SPL.length)].m;p.bag[m]=(p.bag[m]||0)+1;p.sd.e++}
    if((k!=='monster'||p.sd.mk%3===0)&&p.sd.s<4){p.bag.m_scroll=(p.bag.m_scroll||0)+1;p.sd.s++}}}

    if(mv>.5&&Math.random()<.06)skPart({x:q.px+(Math.random()-.5)*q.hh*.4,y:q.py,vx:(Math.random()-.5)*.3,vy:-.15,l:1,d:1.1,r:3,c:'220,185,130',dust:1})}

function wmK(o){const d=new Date(o.dep).getTime(),a=new Date(o.arr).getTime();return Math.max(0,Math.min(1,(tNow()-d)/Math.max(1,a-d)))}

  ${P7()&&C.train?`<div class="card"><div class="kv"><span>🛡️ بيتدرّب ${fmt(C.train.n)} ${CLS[C.train.c]} T${C.train.t}</span><b id="trTxt"></b></div><div class="bar"><i id="trBar"></i></div><button class="btn wide gemb" id="trSpd" style="margin-top:8px">💎 خلّصه دلوقتي · <span id="trG"></span></button></div>`:''}<div class="card"><b style="color:var(--gold)">تدريب جنود</b>${P7()?`<div class="sub" style="margin:2px 0 0">⏳ الوقت: <span id="tTime"></span> · تدريب واحد في نفس الوقت</div>`:''}<div class="train" style="margin-top:8px"><div><label for="tC">النوع</label><select id="tC">${Object.keys(CLS).map(c=>`<option value="${c}" ${c===TR.cls?'selected':''}>${CLS[c]}</option>`).join('')}</select></div><div><label for="tT">المستوى</label><select id="tT">${Array.from({length:open},(_,i)=>`<option value="${i+1}" ${i+1===tier?'selected':''}>T${i+1}</option>`).join('')}</select></div><div><label for="tN">العدد (لحد 50,000)</label><input id="tN" type="number" inputmode="numeric" min="1" max="50000" value="${TR.n}"></div></div>
  <div class="qn">${[100,1000,10000,50000].map(v=>`<button class="btn alt sm" data-qn="${v}">${fmt(v)}</button>`).join('')}<button class="btn alt sm" data-qn="max">الأقصى</button></div>
  <div class="sub" id="tCost" style="margin:8px 0 0"></div><div class="row"><button class="btn wide" id="tGo">🛡️ درّب</button></div></div>`);
  const getN=()=>Math.min(50000,Math.max(1,Math.floor(+$('tN').value||0))),remember=()=>{TR.cls=$('tC').value;TR.tier=+$('tT').value;TR.n=getN();LS.set('najat_tr',TR)};
  const sc=()=>{const c=cost(+$('tT').value,getN()),enough=['meat','wood','iron'].every(k=>cur(k)>=c[k]);$('tCost').innerHTML=`التكلفة: ${rIco('meat',16)} ${fmt(c.meat)} · ${rIco('wood',16)} ${fmt(c.wood)} · ${rIco('iron',16)} ${fmt(c.iron)}${enough?'':' <span class="lose">· الموارد مش كفاية</span>'}`};
  $('tC').onchange=()=>{remember();sc()};$('tT').onchange=()=>{remember();sc()};$('tN').oninput=sc;$('tN').onchange=()=>{$('tN').value=getN();remember();sc()};
  document.querySelectorAll('[data-qn]').forEach(b=>b.onclick=()=>{let v=b.dataset.qn;if(v==='max'){const t=+$('tT').value;v=Math.floor(Math.min(cur('meat')/(5*t),cur('wood')/(3*t),cur('iron')/(t/2)));v=Math.max(1,Math.min(50000,v))}$('tN').value=v;remember();sc()});
  sc();
  if($('tTime')){const st=()=>{$('tTime').textContent=fmtT(trainSecs(+$('tT').value,getN()))};st();$('tT').addEventListener('change',st);$('tN').addEventListener('input',st);document.querySelectorAll('[data-qn]').forEach(b=>b.addEventListener('click',st))}
  if($('trBar')){const iv=setInterval(()=>{if(!$('trBar')||!C.train){clearInterval(iv);return}const L=(C.train.e-Date.now())/1000,T=(C.train.e-C.train.s)/1000;{const b8=$('trBar');if(b8)b8.style.width=Math.min(100,(1-L/T)*100)+'%';const t8=$('trTxt');if(t8)t8.textContent='⏳ '+fmtT(L);const g8=$('trG');if(g8)g8.textContent='💎 '+Math.max(1,Math.ceil(L/60))}},500);
    $('trSpd').onclick=async()=>{const b=$('trSpd'),g=Math.max(1,Math.ceil((C.train.e-Date.now())/60000));if(Number(C.gems||0)<g){toast('الجواهر مش كفاية 💎');panelShop('gem');return}if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='✓ تأكيد: 💎 '+g;return}b.disabled=true;if(await saveCity({gems:Number(C.gems)-g,train:{...C.train,e:Date.now()}}))checkTrain()}}
  $('tGo').onclick=async()=>{remember();const cls=TR.cls,t=TR.tier,n=TR.n,c=cost(t,n);for(const k of ['meat','wood','iron'])if(cur(k)<c[k]){toast('الموارد مش كفاية، اشتري من 🛒 متجر الموارد');return}if(P7()&&C.train){toast('⚠️ الثكنة مشغولة، استنى التدريب يخلص');return}$('tGo').disabled=true;const dur=trainSecs(t,n),now=Date.now(),pc={meat:Math.floor(cur('meat')-c.meat),wood:Math.floor(cur('wood')-c.wood),iron:Math.floor(cur('iron')-c.iron)};if(P7())pc.train={c:cls,t,n,s:now,e:now+dur*1000};
    if(await saveCity(pc)){if(P7()){sfx('ui_confirm');toast(`🛡️ بدأ تدريب ${fmt(n)} ${CLS[cls]} T${t} · ${fmtT(dur)}`)}else{await giveTroops(cls,t,n);track('train',n);sfx('ui_confirm');toast(`اتدرّب ${fmt(n)} ${CLS[cls]} T${t} 🛡️`)}}panelArmy()}}
const PK=[1,5,10,25,50,75,100];
let shopTab=null,busy=false;
const RES_PK={wood:[[10000,100],[50000,450],[200000,1600],[1000000,7000]],meat:[[10000,100],[50000,450],[200000,1600],[1000000,7000]],coal:[[2000,100],[10000,450],[40000,1600],[200000,7000]],iron:[[1000,100],[5000,450],[20000,1600],[100000,7000]]};
const RNAME={wood:'خشب',meat:'لحم',coal:'فحم',iron:'حديد'};
const XP_PK=[[1000,150],[10000,1200],[50000,5000]];
const BUNDLES=[{id:'start',n:'حزمة البداية',d:'أحسن قيمة للاعب الجديد',price:2000,res:{wood:100000,meat:100000,coal:20000,iron:10000},xp:5000,tag:'الأفضل 🔥'},
 {id:'war',n:'حزمة الحرب',d:'موارد وجنود جاهزين للهجوم',price:6000,res:{wood:300000,meat:300000,coal:60000,iron:30000},troops:3000,tag:'خصم 40%'},
 {id:'king',n:'خزنة الملك',d:'كل حاجة بالكوم: موارد وخبرة وجيش',price:25000,res:{wood:2000000,meat:2000000,coal:400000,iron:200000},xp:50000,troops:15000,tag:'فخم 👑',qty:1}];let KQ=1;
function setKQ(n){KQ=Math.max(1,Math.min(100,n|0));const b=BUNDLES.find(x=>x.qty),btn=$('kqBuy');if(!b||!btn)return;$('kqN').textContent=KQ;document.querySelectorAll('[data-bv]').forEach(e=>e.textContent=fmt(+e.dataset.bv*KQ));document.querySelectorAll('[data-kqs]').forEach(e=>e.classList.toggle('on',+e.dataset.kqs===KQ));btn.classList.remove('confirm');btn.dataset.buy='deal:'+b.id+':'+KQ;btn.dataset.price=b.price*KQ;btn.innerHTML=ico('icon_water',20)+' '+fmt(b.price*KQ)};
const rIco=(k,s)=>k==='iron'&&!ART.icon_iron?`<span style="font-size:${Math.round(s*.85)}px;line-height:1">⛓️</span>`:ico('icon_'+k,s);
const card=(icon,label,price,key)=>`<div class="item"><div class="ii">${icon}</div><div class="il">${label}</div><button class="btn wide sm" data-buy="${key}" data-price="${price}">${ico('icon_water',16)} ${fmt(price)}</button></div>`;
function panelShop(tab){if(tab)shopTab=tab;if(!shopTab)shopTab=Number(C.gallons)>0?'res':'gal';
  const TB=[['gal','💧 شحن'],['gem','💎 جواهر'],['msp','⏩ تسريع'],['deal','👑 عروض'],['res','الموارد'],['hero','الأبطال'],['army','الجيش']];let body='';
  if(shopTab==='gal')body=`<p class="sub">1,000 جالون = $1، وكل $25 بتزوّد 10% هدية. (بيتا: الشحن تجريبي من غير دفع)</p><div class="grid">${PK.map(p=>{const bon=Math.floor(p/25)*10,tot=p*1000*(1+bon/100);return `<div class="pk">${bon?`<span class="bonus">+${bon}% هدية</span>`:''}<div class="amt">${ico('icon_water',30)} ${fmt(tot)}</div><div class="price">$${p}</div><button class="btn wide" data-gal="${tot}" data-usd="${p}">اشحن</button></div>`}).join('')}</div>`;
  if(shopTab==='gem')body=('gems' in C)?`<p class="sub">الجواهر عملة نادرة، هتحتاجها بعدين للتسريع واستدعاء الأبطال. بتكسبها كمان من هزيمة الوحوش.</p><div class="grid g2">${[[100,1000],[500,4500],[2000,16000],[10000,70000]].map(([a,p])=>card('<span style="font-size:38px">💎</span>',fmt(a)+' جوهرة',p,'gem:'+a)).join('')}</div>`:'<div class="card sub">⚠️ شغّل ملف SQL الجواهر في Supabase الأول.</div>';
  if(shopTab==='msp')body=`<p class="sub">تسريعات المسيرة: اشتري الكمية مرة واحدة واستخدمها وقت ما تحب.</p>`+mspHTML();if(shopTab==='res')body=Object.keys(RES_PK).map(k=>`<div class="shead" id="sh-${k}">${rIco(k,26)} ${RNAME[k]} <small>عندك ${fmt(cur(k))}</small></div><div class="grid g2">${RES_PK[k].map(([a,p])=>card(rIco(k,42),fmt(a)+' '+RNAME[k],p,`res:${k}:${a}`)).join('')}</div>`).join('');
  if(shopTab==='hero')body=`<p class="sub">كتب الخبرة بترفع ليفل البطل على طول.</p>`+OWN().map(h=>{const s=HEROES.find(x=>x.hero_key===h)||{level:1};return `<div class="shead"><img class="hthumb" src="${ART[HIMG[h]]}" alt=""> ${HN[h].n} <small>Lv ${s.level}</small></div><div class="grid g3">${XP_PK.map(([a,p])=>card('📜',fmt(a)+' XP',p,`xp:${h}:${a}`)).join('')}</div>`}).join('');
  if(shopTab==='army'){const t=tiersOpen();body=`<p class="sub">جنود جاهزين فوراً من أعلى مستوى مفتوح عندك (T${t}). كل ما تطوّر القلعة يتفتح مستوى أقوى.</p>`+Object.keys(CLS).map(c=>`<div class="shead">${ico(CI[c],26)} ${CLS[c]} T${t}</div><div class="grid g3">${[500,2000,10000].map(n=>card(ico(CI[c],40),fmt(n)+' جندي',Math.ceil(n*t*.3),`tr:${c}:${t}:${n}`)).join('')}</div>`).join('')}
  if(shopTab==='deal')body=BUNDLES.map(b=>{const q=b.qty?KQ:1;return `<div class="deal">${b.tag?`<span class="dtag">${b.tag}</span>`:''}<h3>${b.n}</h3><div class="sub" style="margin:0 0 8px">${b.d}</div><div class="dl">${Object.keys(b.res).map(k=>`<span>${rIco(k,20)} <i ${b.qty?`data-bv="${b.res[k]}"`:''}>${fmt(b.res[k]*q)}</i></span>`).join('')}${b.xp?`<span>📜 <i ${b.qty?`data-bv="${b.xp}"`:''}>${fmt(b.xp*q)}</i> XP لكل بطل</span>`:''}${b.troops?`<span>${ico('icon_infantry',20)} <i ${b.qty?`data-bv="${b.troops}"`:''}>${fmt(b.troops*q)}</i> جندي T${tiersOpen()}</span>`:''}</div>${b.qty?`<div class="kqbox"><div class="kqrow"><button class="kqb" data-kq="-1">−</button><div class="kqn">× <b id="kqN">${KQ}</b></div><button class="kqb" data-kq="1">+</button></div><div class="kqchips">${[1,5,10,15,20,50].map(n=>`<button class="${n===KQ?'on':''}" data-kqs="${n}">×${n}</button>`).join('')}</div></div>`:''}<button class="btn wide" ${b.qty?'id="kqBuy"':''} data-buy="deal:${b.id}${b.qty?':'+KQ:''}" data-price="${b.price*q}">${ico('icon_water',20)} ${fmt(b.price*q)}</button></div>`}).join('');
  openSheet(`<h2>المتجر</h2><div class="gbal" data-stab="gal">رصيدك: ${ico('icon_water',22)} <b>${fmt(C.gallons)}</b> جالون <span class="plus">＋</span></div><div class="tabs">${TB.map(([k,n])=>`<button class="${k===shopTab?'on':''}" data-stab="${k}">${n}</button>`).join('')}</div>${body}`);
  document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>panelShop(b.dataset.stab));
  document.querySelectorAll('[data-gal]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='⏳';const pt={};try{C.gallons=await api.topup(+b.dataset.usd)}catch(e){pt.gallons=Number(C.gallons)+Number(b.dataset.gal)}if(P3()){const p=prog();p.vip=(p.vip||0)+Math.floor(+b.dataset.gal/10);pt.progress=p}await saveCity(pt);track('topup',+b.dataset.gal);track('cxusd',+b.dataset.usd);setTimeout(giftPoll,800);sfx('resource_collect');toast('اتضاف 💧 '+fmt(+b.dataset.gal)+' جالون');panelShop()});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b));if(shopTab==='msp')mspBind(()=>panelShop('msp'));document.querySelectorAll('[data-kq]').forEach(b=>b.onclick=()=>setKQ(KQ+(+b.dataset.kq)));document.querySelectorAll('[data-kqs]').forEach(b=>b.onclick=()=>setKQ(+b.dataset.kqs))}
async function giveXP(keys,amt){for(const k of keys){const h=HEROES.find(x=>x.hero_key===k);if(!h||h.level>=100)continue;let lv=h.level,xp=h.xp+amt;while(lv<100&&xp>=need(lv)){xp-=need(lv);lv++}if(lv>=100)xp=0;
  try{const r=await api.setHero(ME.id,k,lv,xp);if(r.level>h.level)sfx('hero_levelup');toast(HN[k].n+' وصلت ليفل '+r.level+' ⬆️');Object.assign(h,r)}catch(e){toast('الخبرة ماتحفظتش')}}}
async function giveTroops(cls,tier,n){const old=TROOPS.find(x=>x.troop_class===cls&&x.tier===tier);try{const r=await api.setTroop(ME.id,cls,tier,(old?old.amount:0)+n);TROOPS=TROOPS.filter(x=>x!==old).concat(r)}catch(e){toast('الجنود ماتحفظوش')}}
async function buy(b){const [type,a1,a2,a3]=b.dataset.buy.split(':'),price=+b.dataset.price,deal=type==='deal'?BUNDLES.find(x=>x.id===a1):null;
  if(Number(C.gallons)<price){toast('الجالونات مش كفاية، اشحن الأول 💧');panelShop('gal');return}
  if(!b.classList.contains('confirm')){document.querySelectorAll('.btn.confirm').forEach(x=>{x.classList.remove('confirm');x.innerHTML=x.dataset.html});b.dataset.html=b.innerHTML;b.classList.add('confirm');b.textContent='✓ تأكيد الشراء';
    setTimeout(()=>{if(b.isConnected&&b.classList.contains('confirm')){b.classList.remove('confirm');b.innerHTML=b.dataset.html}},3500);return}
  if(busy)return;busy=true;b.disabled=true;b.textContent='⏳';
  try{const patch={gallons:Number(C.gallons)-price},add=r=>{for(const k in r)patch[k]=Math.floor(cur(k)+r[k])};
    const dq=deal&&deal.qty?Math.max(1,Math.min(100,+a2||1)):1;if(deal&&price!==deal.price*dq){toast('⚠️ السعر اتغير، جرب تاني');return}if(type==='res')add({[a1]:+a2});if(type==='gem')patch.gems=Number(C.gems||0)+(+a1);if(deal)add(Object.fromEntries(Object.entries(deal.res).map(([k,v])=>[k,v*dq])));
    if(!(await saveCity(patch)))return;
    if(type==='xp')await giveXP([a1],+a2);if(deal&&deal.xp)await giveXP(OWN(),deal.xp*dq);
    if(type==='tr')await giveTroops(a1,+a2,+a3);if(deal&&deal.troops){const t=tiersOpen(),n=Math.floor(deal.troops*dq/3);for(const c of Object.keys(CLS))await giveTroops(c,t,n)}
    track('buy');sfx('resource_collect');toast(dq>1?`✅ اشتريت ${dq} مرات`:'✅ تم الشراء');hud()}
  finally{busy=false;if(!$('sheet').hidden)panelShop()}}

})();
</script>
